[metadata]
name = overleaf-git-unipi
keywords = sharelatex, client, overleaf, git
license_file = LICENSE
url = https://github.com/robol/python-overleaf-git-unipi
author = Leonardo Robol
author_email = leo@robol.it
description = A client to bridge GIT and your overleaf projects (community edition)
long_description = file: README.rst
classifier =
    Development Status :: 4 - Beta
    Intended Audience :: System Administrators
    Intended Audience :: Science/Research
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
packages = find:
setup_requires =
    setuptools>=39.0.1
    wheel>=0.31.0
install_requires =
    socketIO-client==0.5.7.4
    websocket-client==0.59.0
    click~=8.0
    GitPython~=2.1.13
    filetype~=1.0.5
    keyring>=17.1.1,<23.9.0 # https://github.com/GoogleCloudPlatform/artifact-registry-python-tools/issues/33
    lxml>=4.3.3
    python-dateutil>= 2.7.3
    appdirs >= 1.4.3
    requests >= 2.27.0


[options.extras_require]
admin = pymongo~=4.0
bench = locust

[options.packages.find]
exclude =
    docs

[options.entry_points]
console_scripts =
    slatex = sharelatex.cli:cli
    git-slatex = sharelatex.cli:cli
